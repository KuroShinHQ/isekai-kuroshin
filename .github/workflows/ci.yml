name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v3

      # NOT: Windows'tan commit edilen wrapper 100644 kaydedilir → 126 permission
      # denied. Acik chmod (gizli degil, bilinen Windows git davranisi).
      - name: Make gradlew executable
        run: chmod +x gradlew && ./gradlew --version

      # google-services.json GERCEK anahtarlar icerdigi icin gitignore'ludur.
      # CI'da derleme icin gecerli FORMATTA stub uretilir (gercek anahtar DEGIL).
      - name: Generate google-services.json stub
        run: |
          cat > app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "0",
              "project_id": "ci-stub-project",
              "storage_bucket": "ci-stub-project.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:0:android:0000000000000000000000",
                  "android_client_info": { "package_name": "com.example.isekaikuroshin" }
                },
                "oauth_client": [],
                "api_key": [
                  { "current_key": "AIzaSyA-Stub-Stub-Stub-Stub-Stub-Stub" }
                ],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          JSON

      - name: Kotlin compile (assembleDebug — hata gizlenmez)
        run: ./gradlew assembleDebug --console=plain --no-daemon

      - name: Unit tests (testDebugUnitTest — hata gizlenmez)
        run: ./gradlew testDebugUnitTest --console=plain --no-daemon

      - name: Upload test results (fail olsa bile)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 7

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
