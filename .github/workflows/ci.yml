name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gradle wrapper check
        run: |
          if [ -f gradlew ]; then chmod +x gradlew && ./gradlew --version; fi
      - name: Kotlin compile (assembleDebug)
        run: |
          if [ -f gradlew ]; then ./gradlew assembleDebug --console=plain 2>&1 | tail -5; fi

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}